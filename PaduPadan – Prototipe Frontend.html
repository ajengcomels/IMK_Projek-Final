<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PaduPadan</title>
<style>
:root{--bg:#e9e4d8;--wh:#fff;--card:#f8f3e8;--ink:#264653;--mut:#6b7c85;--pri:#279c8b;--acc:#e76f51;--line:#e3b5a6;--chip:#e4e4e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1417;--wh:#14212a;--card:#1d2d35;--ink:#e8efe9;--mut:#9fb1b8;--line:#5a3d36;--chip:#2a3a41;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1417;--wh:#14212a;--card:#1d2d35;--ink:#e8efe9;--mut:#9fb1b8;--line:#5a3d36;--chip:#2a3a41;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:420px;min-height:100%;background:var(--wh);display:flex;flex-direction:column;position:relative}
.scr{flex:1;padding:16px 18px 24px}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0}
.h{display:flex;align-items:center;gap:10px;margin-bottom:14px}.h h2{font-size:20px}
.bk{font-size:22px;padding:4px 8px;margin-left:-8px}
.btn{display:block;width:100%;box-sizing:border-box;text-align:center;border:2px solid var(--pri);background:var(--pri);color:#fff;font:inherit;font-weight:700;padding:12px;border-radius:24px;margin:12px 0;cursor:pointer}
.btn.o{background:none;color:var(--pri)}.btn.d{background:var(--acc);border-color:var(--acc)}
.btn.g{background:#687681;border-color:#687681}
.row{display:flex;gap:10px}.row>*{flex:1}
input,select,textarea{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--wh);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;margin:4px 0 12px}
label{font-weight:600;font-size:13px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{background:var(--chip);border-radius:20px;padding:8px 16px;cursor:pointer;user-select:none}
.chip.on{background:var(--pri);color:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.t{background:var(--card);border-radius:14px;padding:12px;text-align:center;cursor:pointer;border:2px solid transparent}
.t.on{border-color:var(--pri)}
.em{font-size:44px;display:flex;align-items:center;justify-content:center;height:90px;border-radius:12px}
.tag{display:inline-block;background:#f4b9a8;color:#7a3322;border-radius:10px;padding:2px 10px;font-size:12px}
.m{color:var(--mut);font-size:13px}.er{color:#c0392b;font-size:13px;min-height:16px}
.nav{position:sticky;bottom:0;display:flex;justify-content:space-around;align-items:center;background:var(--wh);border-top:1px solid var(--chip);padding:8px 0 10px;font-size:11px}
.nav a{text-align:center;color:var(--mut)}.nav a.on{color:var(--ink);font-weight:700}.nav b{display:block;font-size:20px}
.plus{background:var(--pri);color:#fff!important;border-radius:50%;width:48px;height:48px;line-height:48px;font-size:28px!important;margin-top:-18px}
.sw{display:inline-block;width:30px;height:30px;border-radius:50%;margin:4px;cursor:pointer;border:3px solid transparent}.sw.on{border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--wh);padding:10px 18px;border-radius:20px;z-index:9}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:8}.ov .card{background:var(--wh);max-width:300px}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px}
.ring span{background:var(--card);width:80px;height:80px;border-radius:50%;display:grid;place-items:center}
.bar{height:16px;background:var(--pri);border-radius:8px}
.logo{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;color:#fff;font-size:30px;font-style:italic;font-weight:700}
.ok{width:80px;height:80px;border-radius:50%;background:var(--pri);color:#fff;font-size:44px;display:grid;place-items:center;margin:20px auto}
.ctr{text-align:center}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),go=r=>{location.hash=r};
const EM={Atasan:"👚",Bawahan:"👖",Kerudung:"🧣",Outer:"🧥"};
const st={name:"Syahrini",cur:0,occ:"Kuliah",tab:0,cat:"Semua",q:"",ootd:2,an:1,pw:0,
closet:[{id:1,n:"Maroon Blouse",c:"Atasan",g:"Elegan, Simple, Feminim",col:"#6b2d3a"},{id:2,n:"Blue Jeans",c:"Bawahan",g:"Casual",col:"#5b86b5"},{id:3,n:"Denim Pants",c:"Bawahan",g:"Casual, Simple",col:"#1f2a44"},{id:4,n:"Pink Sweater",c:"Atasan",g:"Feminim",col:"#e3a3b0"},{id:5,n:"Ocean Blue Viscose",c:"Kerudung",g:"Elegan",col:"#8fb4d4"},{id:6,n:"Maroon Cashmere Pashmina",c:"Kerudung",g:"Elegan",col:"#7a2e3a"}]};
const OUT=[{t:"Kuliah",e:["👚","👖","👟","👜"],p:["#bfae9c","#eeeeee","#3a2c2a","#1c1c1c"]},{t:"Kerja",e:["👔","👖","👞","👜"],p:["#c9b79c","#e3dac9","#4b5563","#1c1c1c"]},{t:"Hangout",e:["👕","👖","👟","👜"],p:["#9fb4cf","#c4c9ee","#eae6e1","#1c1c1c"]},{t:"Santai",e:["🧥","👗","👟","🧢"],p:["#e3b3a8","#eadccf","#ece0d4","#f7ebdd"]}];
const NAMES=[["Atasan","Kaos Putih"],["Bawahan","Celana Jeans"],["Sepatu","Sneakers"],["Tas","Tote Bag"]];
function T(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2000)}
function ask(m,fn){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="card"><p>${m}</p><div class="row"><button class="btn o" id="no">Batal</button><button class="btn d" id="yes">Ya, hapus</button></div></div>`;document.body.appendChild(o);o.querySelector("#no").onclick=()=>o.remove();o.querySelector("#yes").onclick=()=>{o.remove();fn()}}
const H=(t,b)=>`<div class="h"><a class="bk" href="#${b}" aria-label="Kembali">←</a><h2>${t}</h2></div>`;
const chips=(a,on,one=1)=>`<div class="chips">${a.map(x=>`<span class="chip${on.includes(x)?" on":""}" tabindex="0" onclick="pk(this,${one})">${x}</span>`).join("")}</div>`;
function pk(el,one){if(one)[...el.parentNode.children].forEach(c=>c.classList.remove("on"));el.classList.toggle("on",one?true:!el.classList.contains("on"))}
const val=(sel)=>[...document.querySelectorAll(sel+" .on")].map(e=>e.textContent.trim());
const tile=(e,col)=>`<div class="em" style="background:${col}33">${e}</div>`;
const sws=["#e8d9cc","#d0c0b3","#5e2d3a","#f2a25c","#000","#d1dcf3","#6b869b","#1d4a7a","#c99a94","#515766","#5f7d68","#a96d9e"];
const swHTML=`<div>${sws.map(c=>`<span class="sw" style="background:${c}" onclick="this.classList.toggle('on')"></span>`).join("")}</div>`;
const fld=(l,id,v="",t="text")=>`<label for="${id}">${l}</label><input id="${id}" type="${t}" value="${v}">`;
const pw=(l,id)=>`<label for="${id}">${l}</label><div style="position:relative"><input id="${id}" type="password"><a style="position:absolute;right:12px;top:14px;cursor:pointer" onclick="const i=$('#${id}');i.type=i.type=='password'?'text':'password'">👁</a></div>`;
const NAV=["home","closet","rec","profile","history","notif"];
const nav=r=>`<nav class="nav">${[["home","🏠","Beranda"],["closet","✨","Koleksi"],["add","+","" ],["rec","👗","Rekomendasi"],["profile","👤","Profil"]].map(([k,i,l])=>k=="add"?`<a href="#add" aria-label="Tambah pakaian"><b class="plus">+</b></a>`:`<a href="#${k}" class="${r==k?"on":""}"><b>${i}</b>${l}</a>`).join("")}</nav>`;
function login(){const e=$("#em").value.trim(),p=$("#pw").value;if(!e||!p){$("#er").textContent="Email dan password wajib diisi.";return}go("home")}
function reg(){const n=$("#nm").value.trim(),e=$("#em").value.trim(),p=$("#pw").value;if(!n||!e||!p){$("#er").textContent="Semua kolom wajib diisi.";return}if(!e.includes("@")){$("#er").textContent="Format email belum benar.";return}if(p.length<6){$("#er").textContent="Password minimal 6 karakter.";return}if(p!==$("#pw2").value){$("#er").textContent="Konfirmasi password tidak sama.";return}st.name=n;T("Akun berhasil dibuat ✓");go("home")}
function grid(){const l=st.closet.filter(x=>(st.cat=="Semua"||x.c==st.cat)&&x.n.toLowerCase().includes(st.q.toLowerCase()));$("#gd").innerHTML=l.length?l.map(x=>`<div class="t" onclick="st.cur=${x.id};go('item')">${tile(EM[x.c],x.col)}<b>${x.n}</b><br><span class="tag">${x.c}</span></div>`).join(""):`<p class="m">Belum ada pakaian yang cocok. Tekan + untuk menambah.</p>`}
function form(i){return `<div class="card ctr" onclick="go('camera')" style="cursor:pointer"><div class="em">📷</div><b>Upload Foto</b></div>${fld("Nama Pakaian","fn",i.n,"text")}<label for="fc">Kategori</label><select id="fc"><option value="">Pilih Kategori</option>${Object.keys(EM).map(k=>`<option${i.c==k?" selected":""}>${k}</option>`).join("")}</select>${fld("Gaya","fg",i.g)}<label for="fd">Deskripsi</label><textarea id="fd" rows="3">${i.d||""}</textarea><div class="er" id="er"></div><button class="btn" onclick="saveItem(${i.id??-1})">Simpan</button>`}
function saveItem(id){const n=$("#fn").value.trim(),c=$("#fc").value;if(!n||!c){$("#er").textContent="Nama dan kategori wajib diisi.";return}const o={n,c,g:$("#fg").value,d:$("#fd").value};if(id>0)Object.assign(st.closet.find(x=>x.id==id),o);else st.closet.push({id:Date.now(),col:"#7a9aa8",...o});T("Pakaian berhasil disimpan ✓");go("closet")}
const R={
splash:()=>`<div class="logo" style="background:#264653;margin:-16px -18px;min-height:100vh">🪝<br>PaduPadan</div>`,
login:()=>`<h1 style="margin-top:30px">Masuk</h1><p>Selamat datang kembali!</p>${fld("Email atau nomor telepon","em")}${pw("Password","pw")}<div class="er" id="er"></div><button class="btn g" onclick="login()">Masuk</button><p class="ctr"><a onclick="T('Tautan reset dikirim ke email kamu')" style="cursor:pointer;font-weight:700">Lupa password?</a></p><button class="btn o" onclick="go('home')">Masuk dengan Google</button><button class="btn o" onclick="go('home')">Masuk dengan Apple</button><p class="ctr m">Belum punya akun? <a href="#register"><b>Daftar</b></a></p>`,
register:()=>`<h1 style="margin-top:30px">Daftar</h1><p>Buat akun untuk mulai menggunakan PaduPadan</p>${fld("Nama lengkap","nm")}${fld("Email","em","","email")}${pw("Password","pw")}${pw("Konfirmasi password","pw2")}<div class="er" id="er"></div><button class="btn g" onclick="reg()">Daftar</button><p class="ctr m">Sudah punya akun? <a href="#login"><b>Masuk</b></a></p>`,
home:()=>`<div class="row" style="align-items:center"><div><h1>Halo, ${st.name} 👋</h1><span class="m">Selamat datang di PaduPadan!</span></div><a href="#notif" style="flex:0;font-size:26px" aria-label="Notifikasi">🔔</a></div><div class="card" id="oc" style="margin-top:14px"><div class="row" style="align-items:center"><h3>OOTD Hari ini</h3><a style="flex:0;cursor:pointer" onclick="$('#oc').remove()" aria-label="Tutup">✕</a></div><a href="#ootd" class="row" style="align-items:center;margin-top:8px">${tile(OUT[st.ootd].e[0],"#264653")}<div><b>Simpel &amp; Kasual</b><br><span style="color:var(--acc);font-weight:700">Lihat Outfit →</span></div></a></div><h3>Quick Recommendation</h3><div class="row" style="margin:10px 0 18px;text-align:center">${["Kuliah:🎒","Hangout:👕","Rapat:💼"].map(x=>{const[a,b]=x.split(":");return`<a onclick="st.occ='${a}';go('quick')" style="cursor:pointer"><div class="em" style="background:#f4a26144">${b}</div>${a}</a>`}).join("")}<a href="#occasion"><div class="em" style="background:#e76f5144">⋯</div>Lainnya</a></div><div class="row"><h3>Riwayat Kombinasi</h3><a href="#history" style="flex:0;white-space:nowrap;color:var(--acc);font-weight:700">Lihat Semua</a></div><div class="row" style="margin-top:10px">${OUT.slice(0,3).map(o=>`<a href="#history" class="card ctr" style="font-size:30px;padding:8px">${o.e[0]}${o.e[1]}</a>`).join("")}</div>`,
ootd:()=>{const o=OUT[st.ootd];return H("OOTD Hari Ini","home")+`<div class="card"><div class="em" style="background:#8884;font-size:54px">${o.e.slice(0,3).join("")}</div><span class="tag">Simpel &amp; Kasual</span> <span class="m">☁ 24°C Berawan</span></div>${o.e.map((e,i)=>`<div class="row" style="align-items:center;margin-bottom:8px"><div style="flex:0">${tile(e,"#888")}</div><div><b>${NAMES[i][0]}</b><br><span class="m">${NAMES[i][1]}</span></div></div>`).join("")}<button class="btn o" style="width:50%" onclick="go('fix')">Koreksi</button>`},
fix:()=>H("Ganti Item","ootd")+NAMES.slice(0,3).map((n,i)=>`<label>${n[0]}</label><select><option>${n[1]}</option><option>Pilihan lain ${i+1}</option></select><br>`).join("")+`<button class="btn" onclick="T('Koreksi diterapkan ✓');go('ootd')">Terapkan</button>`,
notif:()=>H("Notifikasi","home")+["Rekomendasi baru untukmu! · 2 jam lalu","Pakaian baru berhasil disimpan · 1 hari lalu","Jangan lupa melengkapi profil · 1 hari lalu"].map(x=>`<a href="#rec" class="card" style="display:block">🔔 ${x}</a>`).join(""),
quick:()=>H("Quick Recommendation","home")+`<p>Mau memakai outfit untuk?</p><h3>Occasion</h3>${chips(["Kuliah","Rapat","Hangout","Formal"],[st.occ])}<h3>Style (Opsional)</h3>${chips(["Casual","Minimalis","Vintage","Sporty"],["Casual"],0)}<h3>Cuaca</h3><a href="#weather" class="card">☁ 24°C Berawan <span style="float:right">›</span></a><button class="btn" onclick="st.occ=document.querySelector('.chips .on').textContent;go('results')">Rekomendasikan</button>`,
history:()=>H("Riwayat Kombinasi","home")+[["Kuliah","12 Mar 2026","Kasual","26"],["Hangout","10 Mar 2026","Santai","28"],["Rapat","6 Mar 2026","Formal","24"]].map((x,i)=>`<div class="card"><h3>Outfit ${x[0]}</h3><span class="m">${x[1]}</span><div class="row" style="align-items:center"><span style="font-size:34px">${OUT[i].e.slice(0,3).join("")}</span><span class="m">Gaya: ${x[2]}<br>Suhu: ${x[3]}°C</span><a style="flex:0;cursor:pointer;font-size:22px" onclick="this.textContent=this.textContent=='♡'?'❤️':'♡'" aria-label="Favorit">${i==1?"❤️":"♡"}</a></div></div>`).join(""),
closet:()=>{setTimeout(grid);return H("Koleksi Pakaian","home")+`<input placeholder="Cari pakaian…" value="${st.q}" oninput="st.q=this.value;grid()" aria-label="Cari pakaian"><div class="chips">${["Semua","Atasan","Bawahan","Kerudung","Outer"].map(c=>`<span class="chip${st.cat==c?" on":""}" onclick="st.cat='${c}';render()">${c}</span>`).join("")}</div><div class="g2" id="gd"></div>`},
item:()=>{const x=st.closet.find(i=>i.id==st.cur);if(!x)return H("Detail Pakaian","closet")+"<p>Item tidak ditemukan.</p>";return H("Detail Pakaian","closet")+`<div class="card">${tile(EM[x.c],x.col)}</div><h2>${x.n}</h2><span class="tag">${x.c}</span><div class="card" style="margin-top:12px"><b>Detail Pakaian</b><p class="m">Jenis: ${x.c}<br>Gaya: ${x.g||"-"}</p></div><div class="row"><button class="btn" onclick="go('editi')">Edit ✎</button><button class="btn d" onclick="ask('Hapus ${x.n} dari koleksi?',()=>{st.closet=st.closet.filter(i=>i.id!=${x.id});T('Pakaian dihapus');go('closet')})">Hapus 🗑</button></div>`},
editi:()=>{const x=st.closet.find(i=>i.id==st.cur)||{};return H(x.id?"Edit Pakaian":"Konfirmasi Atribut",x.id?"item":"tagging")+form(x)},
add:()=>H("Tambah Pakaian","closet")+form({}),
camera:()=>H("Upload Foto","add")+`<div class="em" style="height:380px;background:#c9a99a;font-size:90px">🧍</div><div class="ctr"><a onclick="go('tagging')" style="cursor:pointer;font-size:56px" aria-label="Ambil foto">⚪</a></div>`,
tagging:()=>{setTimeout(()=>{if(location.hash=="#tagging"){st.cur=0;st.ai=1;go("aiedit")}},1800);return H("Detail Pakaian","camera")+`<div class="card ctr" style="padding:40px"><b>AI Mengenali Pakaian</b><div class="em" style="font-size:70px">👚</div><span class="m">Mohon tunggu sebentar…</span></div>`},
aiedit:()=>H("Konfirmasi Atribut","camera")+`<p class="m">Hasil pengenalan AI. Periksa dan ubah bila belum sesuai.</p>`+form({n:"Kemeja Biru",c:"Atasan",g:"Casual, Simple"}),
rec:()=>`<h2 style="margin-bottom:12px">Rekomendasi Outfit</h2><div class="chips">${["Untuk hari ini","Berdasarkan Acara","Feedback"].map((c,i)=>`<span class="chip${st.tab==i?" on":""}" onclick="st.tab=${i};render()">${c}</span>`).join("")}</div>`+(st.tab==0?`<div class="card ctr"><div class="em" style="font-size:54px">${OUT[2].e.slice(0,3).join("")}</div><h3>Kasual &amp; Santai</h3><div>${OUT[2].p.map(c=>`<span class="sw" style="background:${c}"></span>`).join("")}</div><button class="btn" onclick="st.o=2;go('detail')">Lihat Detail</button></div>`:st.tab==1?`<p>Pilih acara untuk mendapat rekomendasi dari koleksimu.</p><button class="btn" onclick="go('occasion')">Pilih Occasion</button><button class="btn o" onclick="go('filter')">Filter Rekomendasi</button>`:`<p class="m">Beri feedback pada outfit di halaman detail agar rekomendasi makin pas.</p><button class="btn o" onclick="go('results')">Lihat Hasil Rekomendasi</button>`),
filter:()=>H("Filter Rekomendasi","rec")+`<h3>Budget</h3><input type="range" min="0" max="1000" step="10" value="340" oninput="$('#bv').textContent='Rp '+(this.value*1000).toLocaleString('id-ID')" aria-label="Budget"><p class="m" id="bv">Rp 340.000</p><h3>Musim</h3>${chips(["Panas","Dingin","Hujan"],["Dingin"],0)}<h3>Warna Favorit</h3>${swHTML}<h3 style="margin-top:12px">Tipe Pakaian</h3>${chips(["Bawahan","Atasan","Outer","Dress"],["Bawahan","Atasan"],0)}<div class="row"><button class="btn o" onclick="render()">Reset</button><button class="btn" onclick="T('Filter diterapkan ✓');go('results')">Terapkan</button></div>`,
occasion:()=>H("Pilih Occasion","rec")+`<div class="g2">${[["Kuliah","🎒"],["Kerja","💼"],["Hangout","🏠"],["Formal","👔"],["Lainnya","⋯"]].map(([a,b])=>`<div class="t${st.occ==a?" on":""}" tabindex="0" onclick="st.occ='${a}';pk(this,1);$('#ot').style.display='${a}'=='Lainnya'?'block':'none'" style="font-size:13px"><div style="font-size:30px">${b}</div>${a}</div>`).join("")}</div><div id="ot" style="display:none"><label for="od">Lainnya</label><textarea id="od" rows="2" placeholder="Tulis deskripsinya di sini…"></textarea></div><button class="btn" onclick="go('style')">Lanjut</button>`,
style:()=>H("Pilih Style (Opsional)","occasion")+`<div class="g2" id="sg">${[["Minimalist","🍃"],["Casual","👕"],["Feminim","🎀"],["Edgy","🧕"],["Formal","🧥"],["Streetwear","🧢"],["Chic","👜"]].map(([a,b])=>`<div class="t" tabindex="0" onclick="this.classList.toggle('on')"><div style="font-size:34px">${b}</div>${a}</div>`).join("")}</div><button class="btn" onclick="go('weather')">Lanjut</button><button class="btn o" onclick="go('weather')">Lewati</button>`,
weather:()=>H("Cuaca Hari Ini","style")+`<div class="card row" style="align-items:center"><span style="font-size:70px">☁</span><div><h2>Berawan</h2><div style="font-size:34px">24° C</div><span class="m">22° / 25°</span></div></div><div class="card row ctr"><span>☀️<br>Pagi</span><span>☀️<br>Siang</span><span>☀️<br>Sore</span><span>🌧<br>Malam</span></div><p>✓ Rekomendasi outfit menyesuaikan kondisi cuaca hari ini</p><button class="btn" onclick="go('results')">Lanjut</button>`,
results:()=>H("Rekomendasi Outfit","rec")+`<p class="m">Untuk: ${st.occ} · 24°C</p><div class="chips">${["Semua","Kuliah","Kerja","Hangout","Santai"].map(c=>`<span class="chip${(st.rf||"Semua")==c?" on":""}" onclick="st.rf='${c}';render()">${c}</span>`).join("")}</div><div class="g2">${OUT.map((o,i)=>(!st.rf||st.rf=="Semua"||st.rf==o.t)?`<div class="t" onclick="st.o=${i};go('detail')"><div class="em" style="font-size:34px;background:${o.p[0]}55">${o.e.slice(0,3).join("")}</div><span class="tag">${o.t}</span><div>${o.p.map(c=>`<span class="sw" style="background:${c};width:16px;height:16px;margin:2px"></span>`).join("")}</div></div>`:"").join("")}</div>`,
detail:()=>{const o=OUT[st.o];return H("Detail","results")+`<div class="card"><div class="em" style="font-size:60px;height:150px;background:${o.p[0]}44">${o.e.join("")}</div><div>${o.p.map(c=>`<span class="sw" style="background:${c}"></span>`).join("")}</div><h3>Casual | ${o.t} | Siang</h3><div class="chips"><span class="chip">Kemeja</span><span class="chip">Tas</span><span class="chip">Sneakers</span><span class="chip">Jeans</span></div></div><button class="btn" onclick="T('Outfit disimpan ke koleksi ✓')">Simpan ke Koleksi</button><div class="row"><button class="btn o" onclick="go('feedback')">Suka / Tidak</button><button class="btn d" onclick="go('wear')">Pakai Hari Ini</button></div>`},
feedback:()=>H("Feedback","detail")+`<h3 class="ctr">Apakah kamu suka outfit ini?</h3><div class="row" style="margin:12px 0"><div class="chips" style="display:contents">${["Suka","Tidak Suka"].map(c=>`<span class="chip ctr${c=="Suka"?" on":""}" onclick="pk(this,1);$('#rs').style.display='${c}'=='Suka'?'none':'block'">${c}</span>`).join("")}</div></div><div id="rs" style="display:none">${["Warna kurang cocok","Gaya kurang sesuai","Item tidak nyaman","Lainnya"].map(r=>`<p><label><input type="checkbox" style="width:auto;margin:0 8px 0 0">${r}</label></p>`).join("")}</div><button class="btn" onclick="T('Terima kasih! Feedback tersimpan ✓');go('results')">Kirim</button>`,
wear:()=>`<div class="card ctr" style="margin-top:40px"><div class="ok">✓</div><p>Outfit ini sudah ditetapkan sebagai outfit hari ini!</p><button class="btn" onclick="st.ootd=st.o;go('ootd')">Lihat di OOTD hari ini</button><button class="btn o" onclick="go('home')">Kembali ke Beranda</button></div>`,
profile:()=>`<h2 style="margin-bottom:14px">Profil</h2><div class="card ctr"><div class="em" style="font-size:60px">🧕</div><b>${st.name}</b><br><span class="m">syahrini@gmail.com</span></div>${[["editp","👤","Edit Profil"],["pref","🪝","Preferensi Gaya"],["analytics","📊","Analitik Wardrobe"],["mood","🖼","Moodboard Gaya"]].map(([r,i,l])=>`<a href="#${r}" class="card" style="display:block">${i} ${l} <span style="float:right">›</span></a>`).join("")}<a class="card" style="display:block;cursor:pointer" onclick="T('Pusat bantuan segera hadir')">❓ Bantuan <span style="float:right">›</span></a><a class="card" style="display:block;cursor:pointer" onclick="ask('Keluar dari akun?',()=>go('login'))">⎋ Logout <span style="float:right">›</span></a>`,
editp:()=>H("Edit Profil","profile")+fld("Nama","pn",st.name)+fld("Email","pe","syahrini@gmail.com","email")+fld("Tanggal Lahir","pl","1980-08-01","date")+fld("Tinggi Badan (cm)","pt","155","number")+fld("Berat Badan (kg)","pb","56","number")+`<button class="btn" onclick="if(!$('#pn').value.trim()){T('Nama tidak boleh kosong');return}st.name=$('#pn').value.trim();T('Profil disimpan ✓');go('profile')">Simpan</button>`,
pref:()=>H("Preferensi Gaya","profile")+`<h3>Gaya Favorit</h3>${chips(["Minimalis","Casual","Feminim","Edgy","Vintage","Sporty"],["Minimalis"],0)}<h3>Warna Favorit</h3>${swHTML}<h3 style="margin-top:12px">Tipe Pakaian yang Sering Dipakai</h3>${chips(["Atasan","Dress","Bawahan","Outer"],["Dress"],0)}<button class="btn" onclick="T('Preferensi disimpan ✓');go('profile')">Simpan</button><button class="btn o" onclick="go('mood')">Moodboard Gaya</button>`,
mood:()=>H("Moodboard Gaya","pref")+`<p class="m">Upload referensi gaya atau inspirasi outfit yang kamu suka. Ini membantu kami memberikan rekomendasi yang lebih sesuai.</p><div class="g2" id="mb">${["🧥","👖","🧶","👗"].map(e=>`<div class="em" style="background:#c9b79c55">${e}</div>`).join("")}<div class="t" style="background:var(--pri);color:#fff;display:grid;place-items:center" onclick="$('#mb').insertAdjacentHTML('afterbegin','<div class=em style=background:#9fb4cf55>👚</div>');T('Foto ditambahkan')">+ Tambah Foto</div></div><button class="btn" onclick="T('Moodboard disimpan ✓');go('profile')">Simpan</button>`,
analytics:()=>{const d=[["Dress",32],["Atasan",24],["Bawahan",18],["Outer",16],["Gamis",10]],a=[[45,9],[68,18],[82,31]][st.an];return H("Analitik Wardobe","profile").replace("Wardobe","Wardrobe")+`<div class="chips">${["Minggu","Bulan","Tahun"].map((c,i)=>`<span class="chip${st.an==i?" on":""}" onclick="st.an=${i};render()">${c}</span>`).join("")}</div><div class="card row" style="align-items:center"><div class="ring" style="background:conic-gradient(var(--pri) 0 ${a[0]}%,var(--chip) 0)"><span>${a[0]}%</span></div><div class="ctr"><div class="ok" style="width:60px;height:60px;font-size:20px;margin:0 auto">${a[1]}</div><span class="m">Item paling sering dipakai</span></div></div><h3>Kategori Pakaian</h3><div class="card">${d.map(x=>`<div class="row" style="align-items:center;margin:6px 0"><span style="flex:0 0 70px">${x[0]}</span><div class="bar" style="flex:none;width:${x[1]*2.4}px"></div><span class="m" style="flex:0">${x[1]}%</span></div>`).join("")}</div><a href="#rare" class="btn" style="display:block">Dress adalah kategori yang sering kamu pakai! ›</a>`},
rare:()=>H("Pakaian Jarang Dipakai","analytics")+`<p class="m">Berikut adalah pakaian yang jarang kamu pakai dalam 3 bulan terakhir.</p>`+[["🧶","Sweater Rajut",1],["🧥","Jaket Denim",2],["🧣","Pashmina Dubai",2],["👗","Rok Midi",3],["👗","Gamis",4]].map(x=>`<a href="#closet" class="card row" style="align-items:center"><span style="flex:0;font-size:34px">${x[0]}</span><div><b>${x[1]}</b><br><span class="m">Dipakai ${x[2]} kali</span></div><span style="flex:0">›</span></a>`).join("")+`<a href="#closet" class="btn" style="display:block">Lihat Semua</a>`
};
function render(){const r=location.hash.slice(1)||"splash",f=R[r]||R.home;$("#app").innerHTML=`<div class="scr">${f()}</div>`+(NAV.includes(r)?nav(r):"");window.scrollTo(0,0);if(r=="splash")setTimeout(()=>{if(["","#splash"].includes(location.hash))go("login")},1800)}
addEventListener("hashchange",render);render();
</script></body></html>
